                      '<button type="button" class="source-open-btn" data-tag="' +
                      escapeHtml(tag) + '">' + escapeHtml(tag) + "</button>"
                    ).join("") +
                    "</div>"
                  : '<div class="muted">這題沒有來源資訊。</div>'
              }
            </div>
          `
        : `
            <div class="history-card">
              <div style="font-weight:800;">答案解析與來源</div>
              <div class="muted" style="margin-top:8px;">
                ${
                  mode === "practice"
                    ? "送出本題後顯示答案解析與來源。"
                    : "提交整份測驗後顯示答案解析與來源。"
                }
              </div>

    function buildViewerUrlFromSource(src) {
      const sourceDocId = String(src?.doc_id ?? src?.doc ?? src?.source_doc ?? "").trim();
      const sourcePage = src?.page ?? src?.page_no ?? src?.pageno ?? "";
      const viewerChapter = sourceDocId || chapterSelect.value || "";

      const qs = new URLSearchParams({
        subject: getSelectedSubject(),
        data_type: getSelectedDataType(),
        chapter: viewerChapter,
        doc_id: sourceDocId,
        page: String(sourcePage ?? ""),
      });

      return `viewer.html?${qs.toString()}`;
    }

    function renderEvidence(tag, sourceMap) {
      if (mode === 'test' && !testSubmitted) {
        evidenceArea.innerHTML = '<div class="evidence-card"><div class="status-chip status-warn">測驗尚未提交</div><div class="muted">提交前不顯示來源內容。</div></div>';
        return;
      }

      const src = sourceMap && sourceMap[tag];
      if (!src) {
        evidenceArea.innerHTML = '<div class="evidence-card"><div class="status-chip status-warn">找不到來源 ' + escapeHtml(tag) + '</div><div class="muted">這個 tag 不存在於本題來源。</div></div>';
        return;
      }

      const docId = src.doc_id ?? src.doc ?? src.source_doc ?? '-';
      const page = src.page ?? src.page_no ?? src.pageno ?? '-';
      const snippet = src.snippet ?? src.text ?? src.quote ?? '沒有 snippet';
      const imageBlock = renderImageIdBlock(src);

      const extraKeys = Object.keys(src).filter(
        k => ![
          'doc_id', 'doc', 'source_doc',
          'page', 'page_no', 'pageno',
          'snippet', 'text', 'quote',
          'image', 'images'
        ].includes(k)
      );

      evidenceArea.innerHTML = `
        <div class="evidence-card">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <div class="status-chip status-ok">來源 ${escapeHtml(tag)}</div>
            <a href="${escapeHtml(buildViewerUrlFromSource(src))}" target="_blank" rel="noopener noreferrer">
              <button type="button">開啟來源頁</button>
            </a>
          </div>
          <div class="kv">
            <div class="kv-row"><div class="kv-key">doc_id</div><div>${escapeHtml(String(docId))}</div></div>
            <div class="kv-row"><div class="kv-key">page</div><div>${escapeHtml(String(page))}</div></div>
          </div>
          <div>
            <div class="kv-key" style="margin-bottom:6px;">snippet</div>
            <div class="snippet">${escapeHtml(String(snippet))}</div>
          </div>

          ${imageBlock}
          ${extraKeys.length ? `
            <div>
              <div class="kv-key" style="margin-bottom:8px;">其他欄位</div>
              <div class="kv">
                ${extraKeys.map(k => `
                  <div class="kv-row">
                    <div class="kv-key">${escapeHtml(k)}</div>
                    <div>${escapeHtml(safeJson(src[k]))}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderEvidencePlaceholder() {
      evidenceArea.innerHTML = '<div class="evidence-empty">點來源標籤後，這裡會顯示對應內容。</div>';
    }

    function renderEvidenceDefaultForCurrentQuestion() {
      const q = getCurrentQuestion();
      if (!q) { renderEvidencePlaceholder(); return; }
      const sourceMap = q.sources_map || {};
      const tags = Object.keys(sourceMap);
      if (!tags.length) { renderEvidencePlaceholder(); return; }
      if (mode === 'test' && !testSubmitted) { renderEvidencePlaceholder(); return; }
      renderEvidence(tags[0], sourceMap);
    }

    function normalizeOptions(options) {
      if (!options) return { A: '', B: '', C: '', D: '' };
      if (Array.isArray(options)) {
        return { A: options[0] || '', B: options[1] || '', C: options[2] || '', D: options[3] || '' };
      }
      return { A: options.A || '', B: options.B || '', C: options.C || '', D: options.D || '' };
    }

    function deepCloneJson(value) {
      try {
        return JSON.parse(JSON.stringify(value));
      } catch (err) {
        return null;
      }
    }

    function loadHistoryRecord(recordId) {
      const history = loadHistory();
      const record = history.find(item => item.record_id === recordId);
      if (!record) return;

      const snapshotQuestions = Array.isArray(record.exam_snapshot?.questions)
        ? deepCloneJson(record.exam_snapshot.questions)
        : null;
      const snapshotAnswers = record.exam_snapshot?.answers && typeof record.exam_snapshot.answers === "object"
        ? deepCloneJson(record.exam_snapshot.answers)
        : null;

      if (!snapshotQuestions || !snapshotAnswers) {
        alert("這筆紀錄沒有可載入的答題快照。");
        return;
      }

      examData = {
        meta: {
          subject: record.exam_meta?.subject || "-",
          data_type: record.exam_meta?.data_type || "-",
          chapter: record.exam_meta?.chapter || "-",
          lang: record.exam_meta?.lang || "-",
          created_at: record.exam_meta?.created_at || "-"
        },
        questions: deepCloneJson(snapshotQuestions)
      };

      currentFileName = record.exam_file || "history_record.json";
      practiceQuestions = deepCloneJson(snapshotQuestions);
      testQuestions = deepCloneJson(snapshotQuestions);

      practiceIndex = 0;
      testIndex = 0;
      practiceAnswers = {};
      testAnswers = snapshotAnswers || {};
      testSubmitted = true;
      mode = "test";
      currentResultFilter = "all";
      scoreSummaryCollapsed = false;

      syncModeUI();
      updateMeta();
      renderQuestion();
      renderResult();
      renderEvidenceDefaultForCurrentQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function buildWrongQuestionRecords() {
      return testQuestions
        .map((q, idx) => {
          const state = getAnswerState(q, idx);
          const selected = state?.selected || "";
          const correct = q?.answer || "";
          if (!selected || selected === correct) return null;

          return {
            qid: getQuestionId(q, idx),
            index: idx + 1,
            topic: q?.topic || "",
            question: q?.question || "",
            selected: selected,
            correct: correct,
            sources_used: Array.isArray(q?.sources_used) ? q.sources_used : [],
            sources_map: q?.sources_map && typeof q.sources_map === "object" ? q.sources_map : {}
          };
        })
        .filter(Boolean);
    }

    function buildHistoryViewerUrl(record, src) {
      const sourceDocId = String(
        src?.doc_id ?? src?.doc ?? src?.source_doc ?? ""
      ).trim();
      const sourcePage = src?.page ?? src?.page_no ?? src?.pageno ?? "";
      const viewerChapter =
        sourceDocId || record?.exam_meta?.chapter || "";

      const qs = new URLSearchParams({
        subject: record?.exam_meta?.subject || "",
        data_type: record?.exam_meta?.data_type || "",
        chapter: viewerChapter,
        doc_id: sourceDocId,
        page: String(sourcePage ?? "")
      });

      return `viewer.html?${qs.toString()}`;
    }

    function getHistoryQuestionItems(record) {
      const questions = Array.isArray(record?.exam_snapshot?.questions)
        ? record.exam_snapshot.questions
        : [];
      const answers =
        record?.exam_snapshot?.answers &&
        typeof record.exam_snapshot.answers === "object"
          ? record.exam_snapshot.answers
          : {};

      return questions.map((q, idx) => {
        const qid = (q && q.id) || ("Q" + String(idx + 1).padStart(4, "0"));
        const state = answers[qid] || {};
        const selected = state.selected || "";
        const correctAnswer = q?.answer || "";
        const isCorrect = Boolean(selected) && selected === correctAnswer;

        return {
          q,
          idx,
          qid,
          selected,
          correctAnswer,
          isCorrect,
          isWrong: !isCorrect
        };
      });
    }

    function getHistoryViewState(recordId) {
      if (!historyViewState[recordId]) {
        historyViewState[recordId] = {
          expanded: false,
          filter: "all",
          qidx: 0
        };
      }
      return historyViewState[recordId];
    }


    function deleteHistoryRecord(recordId) {
      const history = loadHistory().filter(item => item.record_id !== recordId);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderHistory();
    }

    function saveCurrentResultToHistory() {
      if (!examData || !testQuestions.length) return;
      const meta = examData.meta || {};
      const prevMode = mode;
      mode = 'test';
      const summary = getScoringSummary();
      mode = prevMode;
      const rate = summary.total > 0 ? Number((summary.correctCount / summary.total).toFixed(4)) : 0;
      const wrongQuestions = buildWrongQuestionRecords();

      const record = {
        record_id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        exam_file: currentFileName,
        saved_at: new Date().toISOString(),
        mode: 'test',
        exam_meta: {
          subject: meta.subject || '-',
          data_type: meta.data_type || '-',
          chapter: meta.chapter || '-',
          lang: meta.lang || '-',
          created_at: meta.created_at || '-'
        },
        score: {
          correct: summary.correctCount,
          total: summary.total,
          rate: rate
        },
        wrong_count: wrongQuestions.length,
        wrong_questions: wrongQuestions,
        exam_snapshot: {
          questions: deepCloneJson(testQuestions),
          answers: deepCloneJson(testAnswers)
        }
      };

      const history = loadHistory();
      history.unshift(record);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 20)));
      renderHistory();
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        console.error(err);
        return [];
      }
    }

    function renderHistory() {
      const history = loadHistory();

      if (!history.length) {
        historyArea.innerHTML =
          '<div class="muted">尚無本機歷史測驗紀錄。</div>';
        return;
      }

      historyArea.innerHTML = history.map((item) => {
        const recordId = item.record_id || "";
        const view = getHistoryViewState(recordId);
        const ratePct = Math.round((item.score?.rate || 0) * 100) + "%";
        const allQuestions = getHistoryQuestionItems(item);
        const wrongQuestions = allQuestions.filter((q) => q.isWrong);
        const visibleQuestions =
          view.filter === "wrong" ? wrongQuestions : allQuestions;

        if (
          visibleQuestions.length &&
          !visibleQuestions.some((q) => q.idx === view.qidx)
        ) {
          view.qidx = visibleQuestions[0].idx;
        }

        const selectedItem =
          visibleQuestions.find((q) => q.idx === view.qidx) ||
          visibleQuestions[0] ||
          null;

        const sourceMap =
          selectedItem?.q?.sources_map &&
          typeof selectedItem.q.sources_map === "object"
            ? selectedItem.q.sources_map
            : {};
        const sourceTags = Object.keys(sourceMap);

        const questionOptions = visibleQuestions.length
          ? visibleQuestions.map((questionItem) => {
              const mark = questionItem.isCorrect ? "✓" : "✕";
              const status = questionItem.isCorrect ? "答對" : "答錯";
              return (
                '<option value="' + questionItem.idx + '"' +
                (questionItem.idx === view.qidx ? " selected" : "") +
                ">" +
                mark + " 第 " + (questionItem.idx + 1) + " 題｜" + status +
                "</option>"
              );
            }).join("")
          : '<option value="">沒有符合條件的題目</option>';

        const detailHtml = selectedItem
          ? `
              <div class="history-question-detail">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                  <div class="status-chip ${
                    selectedItem.isCorrect ? "status-ok" : "status-bad"
                  }">
                    ${selectedItem.isCorrect ? "答對" : "答錯"}
                  </div>
                  <strong>
                    第 ${selectedItem.idx + 1} 題 /
                    ${escapeHtml(selectedItem.qid)}
                  </strong>
                </div>

                ${renderFullQuestionReview(
                  selectedItem.q,
                  selectedItem.selected,
                  selectedItem.idx + 1,
                  selectedItem.qid,
                  item,
                  true
                )}

                <div style="font-weight:800;margin-top:14px;">來源頁面</div>
                ${
                  sourceTags.length
                    ? `<div class="history-source-links">${sourceTags.map((tag) => {
                        const src = sourceMap[tag];
                        const docId =
                          src?.doc_id ?? src?.doc ?? src?.source_doc ?? "-";
                        const page =
                          src?.page ?? src?.page_no ?? src?.pageno ?? "-";
                        return `
                          <a
                            class="history-source-link"
                            href="${escapeHtml(buildHistoryViewerUrl(item, src))}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            <button type="button">
                              ${escapeHtml(tag)}｜${escapeHtml(String(docId))}/p${escapeHtml(String(page))}
                            </button>
                          </a>
                        `;
                      }).join("")}</div>`
                    : '<div class="muted" style="margin-top:8px;">這題沒有來源資訊。</div>'
                }
              </div>
            `
          : '<div class="muted" style="margin-top:12px;">目前沒有符合篩選條件的題目。</div>';

        return `
          <div class="history-card" data-history-record="${escapeHtml(recordId)}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
              <div style="min-width:0;">
                <div style="font-weight:800;font-size:16px;">
                  ${escapeHtml(item.exam_meta?.subject || "-")} /
                  ${escapeHtml(item.exam_meta?.chapter || "-")}
                </div>
                <small>${escapeHtml(item.exam_file || "-")}</small>
              </div>

              <div class="history-actions">
                <button
                  type="button"
                  class="btn-primary history-load-btn"
                  data-record-id="${escapeHtml(recordId)}"
                  ${item.exam_snapshot?.questions ? "" : "disabled"}
                >載入紀錄</button>

                <button
                  type="button"
                  class="history-toggle-btn"
                  data-record-id="${escapeHtml(recordId)}"
                  ${allQuestions.length ? "" : "disabled"}
                >${view.expanded ? "收合題目" : "查看每一題"}</button>

                <button
                  type="button"
                  class="btn-danger history-delete-btn"
                  data-record-id="${escapeHtml(recordId)}"
                >刪除此筆</button>
              </div>
            </div>

            <div class="history-summary-grid">
              <div class="history-summary-item">
                <div class="label">模式</div>
                <div class="value">${escapeHtml(item.mode || "-")}</div>
              </div>
              <div class="history-summary-item">
                <div class="label">分數</div>
                <div class="value">
                  ${escapeHtml(String(item.score?.correct ?? 0))} /
                  ${escapeHtml(String(item.score?.total ?? 0))}
                  （${escapeHtml(ratePct)}）
                </div>
              </div>
              <div class="history-summary-item">
                <div class="label">錯題數</div>
                <div class="value">${wrongQuestions.length}</div>
              </div>
              <div class="history-summary-item">
                <div class="label">作答時間</div>
                <div class="value">${escapeHtml(formatTime(item.saved_at))}</div>
              </div>
            </div>

            <div class="history-question-review" ${view.expanded ? "" : "hidden"}>
              <div class="question-review-tools">
                <div class="question-review-field">
                  <label>查看題目</label>
                  <select
                    class="history-question-select"
                    data-record-id="${escapeHtml(recordId)}"
                    ${visibleQuestions.length ? "" : "disabled"}
                  >
                    ${questionOptions}
                  </select>
                </div>

                <div class="question-filter-actions">
                  <button
                    type="button"
                    class="filter-btn history-filter-btn ${
                      view.filter === "all" ? "active" : ""
                    }"
                    data-record-id="${escapeHtml(recordId)}"
                    data-filter="all"
                  >全部題目</button>

                  <button
                    type="button"
                    class="filter-btn history-filter-btn ${
                      view.filter === "wrong" ? "active" : ""
                    }"
                    data-record-id="${escapeHtml(recordId)}"
                    data-filter="wrong"
                  >僅顯示錯題</button>
                </div>
              </div>

              ${detailHtml}
            </div>
          </div>
        `;
      }).join("");

      historyArea.querySelectorAll(".history-load-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const recordId = btn.dataset.recordId || "";
          if (!recordId) return;
          loadHistoryRecord(recordId);
        });
      });

      historyArea.querySelectorAll(".history-toggle-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const recordId = btn.dataset.recordId || "";
          if (!recordId) return;
          const view = getHistoryViewState(recordId);
          view.expanded = !view.expanded;
          renderHistory();
        });
      });

      historyArea.querySelectorAll(".history-question-select").forEach((select) => {
        select.addEventListener("change", () => {
          const recordId = select.dataset.recordId || "";
          const idx = Number(select.value);
          if (!recordId || Number.isNaN(idx)) return;
          const view = getHistoryViewState(recordId);
          view.qidx = idx;
          renderHistory();
        });
      });

      historyArea.querySelectorAll(".history-filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const recordId = btn.dataset.recordId || "";
          const filter = btn.dataset.filter || "all";
          if (!recordId) return;
          const view = getHistoryViewState(recordId);
          view.filter = filter === "wrong" ? "wrong" : "all";
          renderHistory();
        });
      });

      historyArea.querySelectorAll(".history-delete-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const recordId = btn.dataset.recordId || "";
          if (!recordId) return;
          if (!confirm("確定要刪除此筆歷史紀錄嗎？")) return;
          delete historyViewState[recordId];
          deleteHistoryRecord(recordId);
        });
      });
    }

    function formatTime(isoString) {
      if (!isoString) return '-';
      const d = new Date(isoString);
      if (Number.isNaN(d.getTime())) return String(isoString);
      return d.toLocaleString();
    }

    function shuffleArray(arr) {
      const out = [...arr];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }


    function normalizeImageCandidates(value) {
      const out = [];

      function walk(v) {
        if (typeof v === "string") {
          const s = v.trim();
          if (s) out.push(s);
          return;
        }

        if (Array.isArray(v)) {
          v.forEach(walk);
          return;
        }

        if (v && typeof v === "object") {
          [
            v.rel_path,
            v.path,
            v.file_name,
            v.name,
            v.image,
            v.url,
            v.image_url
          ].forEach(walk);

          if (Array.isArray(v.images)) {
            walk(v.images);
          }
        }
      }

      walk(value);

      return [...new Set(out)].filter(x =>
        /\.(png|jpg|jpeg|gif|webp|bmp|svg)$/i.test(x) ||
        x.startsWith("http://") ||
        x.startsWith("https://") ||
        x.includes("/")
      );
    }

    async function resolveImageUrl(raw) {
      const value = String(raw || "").trim();
      if (!value) return null;

      if (value.startsWith("http://") || value.startsWith("https://")) {
        return value;
      }

      const tryResolve = async (paramName) => {
        try {
          const resp = await fetch(`${API_BASE}/api/resolve_image_url?${paramName}=${encodeURIComponent(value)}`);
          const data = await resp.json();

          if (!resp.ok || !data.ok) return null;

          const rawUrl = data.url || data.image_url;
          if (!rawUrl) return null;

          if (String(rawUrl).startsWith("http://") || String(rawUrl).startsWith("https://")) {
            return rawUrl;
          }

          return `${API_BASE}${rawUrl}`;
        } catch (err) {
          return null;
        }
      };

      return await tryResolve("image") || await tryResolve("path");
    }

    async function renderResolvedImages(containerId, candidates) {
      const box = document.getElementById(containerId);
      if (!box) return;

      const values = normalizeImageCandidates(candidates);
      if (!values.length) {
        box.innerHTML = "";
        return;
      }

      box.innerHTML = '<span class="muted">圖片載入中...</span>';

      const resolved = [];
      for (const value of values) {
        const url = await resolveImageUrl(value);
        if (url) {
          resolved.push({ value, url });
        }
      }

      if (!resolved.length) {
        box.innerHTML = '<span class="muted">圖片無法解析</span>';
        return;
      }

      box.innerHTML = `
        <div class="evidence-image-grid">
          ${resolved.map((item) => `
            <a class="evidence-image-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
              <div class="evidence-image-thumb">
                <img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.value)}" loading="lazy" />
              </div>
              <div class="evidence-image-cap">${escapeHtml(item.value)}</div>
            </a>
          `).join("")}
        </div>
      `;
    }

    function renderImageIdBlock(src) {
      const values = normalizeImageCandidates([
        src?.image,
        src?.images
      ]);

      if (!values.length) {
        return "";
      }

      const imageBlockId = "evidenceImagesBox_" + Math.random().toString(36).slice(2);

      setTimeout(() => {
        renderResolvedImages(imageBlockId, values);
      }, 0);

      return `
        <div>
          <div class="kv-key" style="margin-bottom:8px;">圖片</div>
          <div id="${imageBlockId}" class="evidence-image-grid"><span class="muted">圖片載入中...</span></div>
        </div>
      `;
    }

    function safeJson(value) {
      if (typeof value === 'string') return value;
      try { return JSON.stringify(value, null, 2); }
      catch { return String(value); }
    }
  </script>
</body>
